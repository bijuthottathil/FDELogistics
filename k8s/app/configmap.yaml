apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  SQL_SERVER_HOST: "mssql"          # in-cluster Service name from k8s/mssql/service.yaml
  SQL_SERVER_PORT: "1433"
  # OPENAI or DEEPSEEK — the OLLAMA fallback in src/orchestrator.py needs a
  # local Ollama server, which isn't bundled into this image/cluster.
  Agent_llm: "OPENAI"
  # LOCAL (HuggingFace, downloaded on first run) or OPENAI.
  Embeddings_model: "OPENAI"
  Local_Embedding_Model: "BAAI/bge-m3"
